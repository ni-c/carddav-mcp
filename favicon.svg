<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="carddav-mcp">
  <!-- Hand-written, not generated: a favicon has no source that could drift.
       The indigo is the same #4f46e5 as the theme colour in .vitepress/config.ts,
       and the mark has to read at 16px, which rules out anything finer than a
       card with a single figure on it. The sister server's icon is a calendar
       page; this one has to be distinguishable from it in a row of tabs, so the
       silhouette is deliberately different — landscape rather than portrait,
       with no header rule. -->
  <rect width="32" height="32" rx="7" fill="#4f46e5" />
  <!-- The card. Landscape, which is what makes it read as a contact card at
       16px rather than as a document. -->
  <rect x="4.5" y="7.5" width="23" height="17" rx="2.4" fill="none" stroke="#ffffff"
        stroke-width="2.2" />
  <!-- A head and shoulders on the left. Two shapes, because one is a dot and
       three stop resolving. -->
  <circle cx="12.2" cy="13.6" r="2.6" fill="#ffffff" />
  <path d="M8.2 20.4c0-2.2 1.8-3.6 4-3.6s4 1.4 4 3.6" fill="none" stroke="#ffffff"
        stroke-width="2.2" stroke-linecap="round" />
  <!-- Two lines of detail on the right. The single #a5b4fc accent the family
       allows, on the shorter one. -->
  <path d="M19.6 13.2h4.6" fill="none" stroke="#ffffff" stroke-width="2.2"
        stroke-linecap="round" />
  <path d="M19.6 18h3" fill="none" stroke="#a5b4fc" stroke-width="2.2"
        stroke-linecap="round" />
</svg>
